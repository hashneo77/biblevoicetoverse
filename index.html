<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Voice</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f1724;
      --text-dark: #e6eef6;
      --muted-dark: #9aa4b2;
      --accent-dark: #ffd166;

      --bg-light: #ffffff;
      --text-light: #1a1a1a;
      --muted-light: #555555;
      --accent-light: #0077cc;
    }

    body {
      height:100%; margin:0;
      font-family: Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
      transition: background 0.3s, color 0.3s;
    }

    /* Dark theme */
    body[data-theme="dark"] {
      background: linear-gradient(180deg, #071028 0%, var(--bg-dark) 100%);
      color: var(--text-dark);
    }

    /* Light theme */
    body[data-theme="light"] {
      background: var(--bg-light);
      color: var(--text-light);
    }

    .wrap { max-width:1200px; margin:28px auto; padding:20px }

    .top { display:flex; gap:18px; align-items:center; justify-content:space-between; margin-bottom:18px }

    .brand { display:flex; gap:14px; align-items:center }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background-image: url("logo.png");
      background-size: cover;
      background-position: center;
    }

    h1 { margin:0; font-family:"Playfair Display",serif; font-size:22px }
    p.lead { margin:0; font-size:14px }
    p.talk { margin:0; font-size:12px }

    .controls { display:flex;flex-wrap:wrap;gap:12px;align-items:center }

    .btn {
      border:1px solid transparent;
      padding:10px 16px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      transition: background .2s, color .2s, border .2s;
    }
    body[data-theme="dark"] .btn {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.1);
      color: var(--accent-dark);
    }
    body[data-theme="light"] .btn {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
      color: var(--accent-light);
    }

    .btn.secondary { color: inherit }
    .btn.icon { font-size:18px; padding:10px 12px }

    .panel {
      border-radius:14px; padding:18px;
      display:flex;flex-direction:column;gap:14px;align-items:center;
      transition: background .3s;
    }
    body[data-theme="dark"] .panel { background: rgba(255,255,255,0.02) }
    body[data-theme="light"] .panel { background: rgba(0,0,0,0.02) }

    .transcript, .log { font-size:14px; }

    /* Make the verse-stage position relative so controls inside it can be absolutely placed */
    .verse-stage {
      margin-top:6px;flex:1;display:flex;align-items:center;justify-content:center;
      padding:22px;border-radius:12px;min-height:550px;text-align:center;
      width:90%;       /* 90% of the parent width */
      max-width:1250px; /* corrected to include px */
      position: relative; /* NEW: for the maximize button */
      overflow: hidden;
    }
    body[data-theme="dark"] .verse-stage { background: rgba(255,255,255,0.02) }
    body[data-theme="light"] .verse-stage { background: rgba(0,0,0,0.02) }

    /* When verse-stage is logically "expanded" (we also request browser fullscreen) make the content larger */
    .verse-stage.fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: unset !important;
      padding: 40px !important;
      border-radius: 0 !important;
      display:flex;
      align-items:center;justify-content:center;
    }

    /* Fullscreen background override by theme: exactly what the user asked for */
    body[data-theme="light"] .verse-stage.fullscreen {
      background: var(--bg-light) !important; /* white */
      color: var(--text-light);
    }
    body[data-theme="dark"] .verse-stage.fullscreen {
      background: #000000 !important; /* black */
      color: var(--text-dark);
    }

    .verse-ref { font-family:"Playfair Display",serif;font-weight:700;font-size:34px;margin-bottom:8px }
    .verse-body { font-size:44px;line-height:1.15;font-weight:600 }

    body[data-theme="dark"] .verse-ref { color: var(--accent-dark) }
    body[data-theme="dark"] .verse-body { color: #f7fbff; text-shadow:0 6px 20px rgba(0,0,0,0.6) }

    body[data-theme="light"] .verse-ref { color: var(--accent-light) }
    body[data-theme="light"] .verse-body { color: var(--text-light) }

    @media (max-width:900px){
      .verse-ref{font-size:26px}
      .verse-body{font-size:28px}
    }

    /* hidden file input visually */
    #xmlFileInput { display:none; }

    /* Mic icon next to Start button */
    .mic-icon {
      display: inline-block;
      width: 22px;
      height: 22px;
      margin-left: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.08);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
      vertical-align: middle;
      position: relative;
      transition: background .15s, box-shadow .15s, transform .15s;
      pointer-events: none; /* decorative only */
    }

    /* small mic glyph inside */
    .mic-icon::after {
      content: '🎤';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      filter: grayscale(100%); /* grey when inactive */
      transition: filter .15s;
    }

    /* Recording state — red background + pulsing */
    .mic-icon.recording {
      background: linear-gradient(135deg, #ff5a5a, #d60000);
      box-shadow: 0 0 0 6px rgba(214,0,0,0.08), 0 0 18px rgba(214,0,0,0.12);
      transform: scale(1.02);
      animation: micPulse 1.2s infinite ease-in-out;
    }
    .mic-icon.recording::after {
      filter: none; /* full color emoji */
    }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(214,0,0,0.12); }
      70% { box-shadow: 0 0 0 10px rgba(214,0,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(214,0,0,0); }
    }

    /* Maximize button inside verse-stage (moved slightly left to make room for rec button) */
    .verse-max-btn {
      position: absolute;
      right: 56px; /* moved to the left to free up the top-right corner */
      top: 14px;
      z-index: 30;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight:700;
      backdrop-filter: blur(4px);
    }
    body[data-theme="dark"] .verse-max-btn {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.08);
      color: var(--accent-dark);
    }
    body[data-theme="light"] .verse-max-btn {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.06);
      color: var(--accent-light);
    }

    .verse-max-btn:focus { outline: 3px solid rgba(0,0,0,0.08); }

    /* Recording indicator button (top-right). Hidden when not recording. */
    .verse-rec-btn {
      position: absolute;
      right: 14px; /* top-right corner */
      top: 14px;
      z-index: 40;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: none; /* shown only when recording */
      align-items: center;
      justify-content: center;
      font-weight:700;
      cursor: default;
      border: none;
      box-shadow: 0 6px 18px rgba(214,0,0,0.18);
      transform-origin: center;
    }
    /* Visual style for red recording button */
    .verse-rec-btn.rec {
      display: inline-flex;
      background: linear-gradient(135deg,#ff4b4b,#d40000);
      color: white;
      animation: recPulse 1.2s infinite ease-in-out;
    }
    @keyframes recPulse {
      0% { transform: scale(1); box-shadow: 0 6px 18px rgba(214,0,0,0.18); }
      50% { transform: scale(1.05); box-shadow: 0 10px 22px rgba(214,0,0,0.22); }
      100% { transform: scale(1); box-shadow: 0 6px 18px rgba(214,0,0,0.18); }
    }

    /* accessible hidden label for screen-readers if you want one */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
      border: 0; padding: 0; margin: -1px;
    }
  </style>
</head>
<body data-theme="light">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Bible Voice</h1>
          <p class="lead">Speak a reference. Use ← / → or buttons to navigate verses.</p>
        </div>
      </div>

      <div class="controls">
        <button id="startStopBtn" class="btn">Start</button>
        <!-- mic indicator placed beside Start -->
        <span id="micIcon" class="mic-icon" role="img" aria-hidden="true" title="Microphone status"></span>

        <button id="prevBtn" class="btn secondary icon">◀</button>
        <button id="nextBtn" class="btn secondary icon">▶</button>
        <button id="langBtn" class="btn secondary">EN / ML</button>
        <button id="bigMinus" class="btn secondary">A-</button>
        <button id="bigPlus" class="btn">A+</button>
        <button id="themeBtn" class="btn">🌞/🌙</button>
        <button id="loadLocalBtn" class="btn secondary">Load local XML</button>
      </div>
    </div>

    <div class="panel">
      <div class="transcript" id="transcript"></div>

      <!-- Verse stage: maximize button is here -->
      <div class="verse-stage" id="verseStage">
        <!-- Recording indicator (appears only during recording) -->
        <button id="verseRecBtn" class="verse-rec-btn" aria-hidden="true" title="Recording" type="button">●</button>

        <!-- maximize button -->
        <button id="verseMaxBtn" class="verse-max-btn" aria-pressed="false" title="Maximize (F)">⤢</button>

        <div>
          <div class="verse-ref" id="verseRef">Jesus Loves You</div>
          <div class="verse-body" id="verseBody"></div>
        </div>
      </div>

      <div class="log" id="log">Ready</div>
    </div>
  </div>

  <!-- hidden file input for manual-loading fallback -->
  <input id="xmlFileInput" type="file" accept=".xml,.XML" />

<script>
let BOOK_ALIASES = {};
async function loadBookAliases() {
  try {
    const res = await fetch('./book_aliases.json');
    BOOK_ALIASES = await res.json();
    console.log("✅ Loaded aliases:", BOOK_ALIASES);
  } catch (e) {
    console.warn("Could not load book_aliases.json", e);
  }
}
loadBookAliases();

function normalizeSpoken(s){return s.trim().replace(/\bchapter\b/gi,' ').replace(/\bverse\b/gi,' ').replace(/\s+/g,' ').toLowerCase();}
function wordsToNumber(w){const m={'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10};if(!isNaN(Number(w))) return Number(w);return m[w]||null;}

/* parseReference unchanged (still uses BOOK_ALIASES to return {book,chapter,verse}) */
function parseReference(text){
  console.log("🔹 Input text:", text);
  const s = normalizeSpoken(text);
  console.log("🔹 Normalized text:", s);
  const tokens = s.split(/\s+/).filter(Boolean);
  console.log("🔹 Tokens:", tokens);

  for (let len = Math.min(3, tokens.length); len >= 1; len--) {
    const candidate = tokens.slice(0, len).join(' ');
    console.log(`➡️ Trying candidate book name [len=${len}]:`, candidate);
    if (BOOK_ALIASES[candidate]) {
      const book = BOOK_ALIASES[candidate];
      console.log("✅ Matched book alias:", candidate, "→", book);
      let rest = tokens.slice(len).join(' ');
      console.log("🔹 Raw remaining text after book:", rest);
      const fillerPattern = /\b(chapter|chap|verse|v|was|that|the|number|num|of|and|please|read)\b/gi;
      rest = rest.replace(fillerPattern, ' ').replace(/[.,;!?]/g, ' ').trim();
      rest = rest.replace(/\s+/g, ' ');
      console.log("🔹 Cleaned remaining text:", rest);

      const colon = rest.match(/(\d+):(\d+)/);
      if (colon) {
        console.log("✅ Found chapter:verse pattern:", colon[0]);
        return { book, chapter: +colon[1], verse: +colon[2] };
      }
      if (!rest) {
        console.log("⚠️ No chapter/verse provided after cleaning — returning null");
        return null;
      }
      const nums = rest.split(/\s+/).filter(Boolean);
      console.log("🔹 Numbers/words after split:", nums);
      if (nums.length >= 2) {
        const c = (Number(nums[0]) || wordsToNumber(nums[0]));
        const v = (Number(nums[1]) || wordsToNumber(nums[1]));
        console.log("🔹 Parsed chapter candidate:", c, "verse candidate:", v);
        if (Number.isFinite(c) && Number.isFinite(v) && c > 0 && v > 0) {
          console.log("✅ Returning book/chapter/verse from numbers");
          return { book, chapter: c, verse: v };
        } else {
          console.log("❌ Could not parse both chapter & verse from:", nums[0], nums[1]);
        }
      }
      if (nums.length === 1) {
        const c = (Number(nums[0]) || wordsToNumber(nums[0]));
        console.log("🔹 Parsed single chapter candidate:", c);
        if (Number.isFinite(c) && c > 0) {
          console.log("✅ Returning book/chapter with default verse 1");
          return { book, chapter: c, verse: 1 };
        } else {
          console.log("❌ Could not parse chapter from single token:", nums[0]);
        }
      }
      console.log("⚠️ Book matched but failed to extract chapter/verse after cleaning.");
      return null;
    } else {
      console.log("❌ No match for book alias:", candidate);
    }
  }
  console.log("⚠️ No valid reference found.");
  return null;
}

/* DOM refs */
const startStopBtn=document.getElementById('startStopBtn');
const micIcon=document.getElementById('micIcon');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const transcriptEl=document.getElementById('transcript');
const verseRefEl=document.getElementById('verseRef');
const verseBodyEl=document.getElementById('verseBody');
const logEl=document.getElementById('log');
const bigPlus=document.getElementById('bigPlus');
const bigMinus=document.getElementById('bigMinus');
const themeBtn=document.getElementById('themeBtn');
const loadLocalBtn=document.getElementById('loadLocalBtn');
const langBtn=document.getElementById('langBtn');
const xmlFileInput=document.getElementById('xmlFileInput');
const verseStage = document.getElementById('verseStage');
const verseMaxBtn = document.getElementById('verseMaxBtn');
const verseRecBtn = document.getElementById('verseRecBtn');

let currentRef = null, baseFontSize = 44;
function log(msg){ logEl.innerText = msg; console.log(msg); }

/* ===== Multi-language local XML storage =====
   We'll preload BOTH files when possible into:
     english = { data, bookNames, englishToKeyMap }
     malayalam = { data, bookNames, englishToKeyMap }
   active pointers:
     bibleData, bibleBookNames, bibleEnglishToKeyMap -> point to current language's data
*/
let englishXML = null;
let malayalamXML = null;

let bibleData = null;
let bibleBookNames = null;
let bibleEnglishToKeyMap = null;
let currentLanguage = 'EN'; // 'EN' or 'ML'

/* Parse Zefania XML into structured object and english->xmlKey map */
function parseBibleXMLString(xmlString) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "application/xml");
    const parseError = doc.querySelector("parsererror");
    if (parseError) throw new Error("XML parse error");

    const bibleDataLocal = {};
    const englishToKeyMap = {};
    const books = doc.getElementsByTagName("BIBLEBOOK");
    for (let i=0; i<books.length; i++) {
      const book = books[i];
      const xmlKey = book.getAttribute("bname") || book.getAttribute("bsname") || book.getAttribute("bnumber") || book.getAttribute("btitle") || `Book${i+1}`;
      const bsname = book.getAttribute("bsname"); // english name
      bibleDataLocal[xmlKey] = bibleDataLocal[xmlKey] || {};
      if (bsname) englishToKeyMap[ bsname.toLowerCase() ] = xmlKey;
      const chapters = book.getElementsByTagName("CHAPTER");
      for (let c=0;c<chapters.length;c++){
        const chap = chapters[c];
        const cnumber = chap.getAttribute("cnumber") || String(c+1);
        bibleDataLocal[xmlKey][cnumber] = bibleDataLocal[xmlKey][cnumber] || {};
        const verses = chap.getElementsByTagName("VERS");
        for (let v=0; v<verses.length; v++){
          const vers = verses[v];
          const vnumber = vers.getAttribute("vnumber") || String(v+1);
          const text = (vers.textContent || "").trim();
          bibleDataLocal[xmlKey][cnumber][vnumber] = text;
        }
      }
    }
    const bookNamesSet = Object.keys(bibleDataLocal);
    return { bibleDataLocal, bookNamesSet, englishToKeyMap };
  } catch (e) {
    console.error(e);
    return null;
  }
}

/* Helper to assign parsed object to english or malayalam slot */
function assignParsedToLang(parsedObj, lang) {
  if (!parsedObj) return;
  if (lang === 'EN') {
    englishXML = {
      data: parsedObj.bibleDataLocal,
      bookNames: parsedObj.bookNamesSet,
      englishToKeyMap: parsedObj.englishToKeyMap || null
    };
  } else if (lang === 'ML') {
    malayalamXML = {
      data: parsedObj.bibleDataLocal,
      bookNames: parsedObj.bookNamesSet,
      englishToKeyMap: parsedObj.englishToKeyMap || null
    };
  }
}

/* Load XML from path and return parsed object or null */
async function fetchAndParse(path) {
  try {
    const resp = await fetch(path, { cache: 'no-store' });
    if (!resp.ok) throw new Error('Fetch status ' + resp.status);
    const txt = await resp.text();
    const parsed = parseBibleXMLString(txt);
    if (!parsed) throw new Error('Failed to parse XML from ' + path);
    return parsed;
  } catch (e) {
    console.warn('fetchAndParse failed for', path, e);
    return null;
  }
}

/* Resolve spoken (English canonical) book name to the current XML's key */
function resolveBookName(spokenBook) {
  if (!bibleData) return spokenBook;
  if (bibleData[spokenBook]) return spokenBook;
  const lower = spokenBook.toLowerCase();
  for (const k of Object.keys(bibleData)) if (k.toLowerCase() === lower) return k;
  if (bibleEnglishToKeyMap) {
    const mapped = bibleEnglishToKeyMap[lower];
    if (mapped && bibleData[mapped]) return mapped;
  }
  const stripped = lower.replace(/[\s\.]/g,'');
  for (const k of Object.keys(bibleData)) if (k.toLowerCase().replace(/[\s\.]/g,'') === stripped) return k;
  for (const k of Object.keys(bibleData)) if (k.toLowerCase().startsWith(lower)) return k;
  return spokenBook;
}

/* set mic visual state (unchanged) */
function setRecordingState(isRecording){
  if(!micIcon) return;
  if(isRecording){
    micIcon.classList.add('recording');
    micIcon.setAttribute('aria-hidden','false');
    micIcon.setAttribute('title','Recording — click Stop to end');
    if (verseRecBtn) {
      verseRecBtn.classList.add('rec');
      verseRecBtn.setAttribute('aria-hidden','false');
      verseRecBtn.removeAttribute('hidden');
      verseRecBtn.style.display = 'inline-flex';
      verseRecBtn.title = 'Recording';
    }
  } else {
    micIcon.classList.remove('recording');
    micIcon.setAttribute('aria-hidden','true');
    micIcon.setAttribute('title','Not recording');
    if (verseRecBtn) {
      verseRecBtn.classList.remove('rec');
      verseRecBtn.setAttribute('aria-hidden','true');
      verseRecBtn.setAttribute('hidden','');
      verseRecBtn.style.display = 'none';
      verseRecBtn.title = '';
    }
  }
}

/* Show verse using whatever bibleData is currently active */
async function showVerse(parsed){
  try{
    if(!parsed) { log("No reference to show."); return; }
    const resolvedBook = bibleData ? resolveBookName(parsed.book) : parsed.book;
    // try local bible first
    if (bibleData && bibleData[resolvedBook] && bibleData[resolvedBook][String(parsed.chapter)] && bibleData[resolvedBook][String(parsed.chapter)][String(parsed.verse)]) {
      const text = bibleData[resolvedBook][String(parsed.chapter)][String(parsed.verse)];
      verseRefEl.innerText = `${resolvedBook} ${parsed.chapter}:${parsed.verse}`;
      verseBodyEl.innerText = text;
      verseBodyEl.style.fontSize = baseFontSize + 'px';
      currentRef = parsed;
      log(resolvedBook + ' ' + parsed.chapter + ':' + parsed.verse);
      return;
    }
    if (bibleData) {
      if (bibleData[resolvedBook] && bibleData[resolvedBook][String(parsed.chapter)]) {
        log(`Verse ${parsed.verse} not found in ${resolvedBook} ${parsed.chapter}.`);
      } else {
        log(`Chapter ${parsed.chapter} not found in ${resolvedBook}.`);
      }
    }
    // Fallback to remote bible-api.com
    const ref = `${parsed.book} ${parsed.chapter}:${parsed.verse}`;
    log('Trying remote API for: ' + ref);
    const resp = await fetch(`https://bible-api.com/${encodeURIComponent(ref)}`);
    if(!resp.ok) throw new Error('Remote API status ' + resp.status);
    const data = await resp.json();
    verseRefEl.innerText = data.reference + (data.translation_id ? ` — ${data.translation_id}` : '');
    verseBodyEl.innerText = data.text.trim();
    verseBodyEl.style.fontSize = baseFontSize + 'px';
    currentRef = parsed;
    log('Loaded from remote API.');
  }catch(e){ log('Error: ' + (e && e.message ? e.message : e)); }
}

/* navigation, font, theme, fullscreen, keyboard — unchanged logic; wire up handlers below */
prevBtn.addEventListener('click',()=>{ if(currentRef && currentRef.verse>1) showVerse({...currentRef,verse:currentRef.verse-1}); });
nextBtn.addEventListener('click',()=>{ if(currentRef) showVerse({...currentRef,verse:currentRef.verse+1}); });
bigPlus.addEventListener('click',()=>{ baseFontSize=Math.min(120,baseFontSize+8); verseBodyEl.style.fontSize=baseFontSize+'px'; });
bigMinus.addEventListener('click',()=>{ baseFontSize=Math.max(18,baseFontSize-6); verseBodyEl.style.fontSize=baseFontSize+'px'; });
themeBtn.addEventListener('click',()=>{ const body=document.body; body.dataset.theme = (body.dataset.theme==="dark" ? "light" : "dark"); });

function isDocumentInFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement); }
async function requestFullscreen(element) { if (element.requestFullscreen) return element.requestFullscreen(); if (element.webkitRequestFullscreen) return element.webkitRequestFullscreen(); if (element.msRequestFullscreen) return element.msRequestFullscreen(); return Promise.reject(new Error('Fullscreen API not supported')); }
async function exitFullscreen() { if (document.exitFullscreen) return document.exitFullscreen(); if (document.webkitExitFullscreen) return document.webkitExitFullscreen(); if (document.msExitFullscreen) return document.msExitFullscreen(); return Promise.reject(new Error('Exit Fullscreen API not supported')); }
function updateMaxButtonUI(isFull) { verseMaxBtn.setAttribute('aria-pressed', String(!!isFull)); verseMaxBtn.title = isFull ? 'Exit fullscreen (Esc or F)' : 'Maximize (F)'; verseMaxBtn.innerText = isFull ? '⤡' : '⤢'; if (isFull) verseStage.classList.add('fullscreen'); else verseStage.classList.remove('fullscreen'); }
async function toggleFullscreen() { try { const inFs = isDocumentInFullscreen(); if (!inFs) { await requestFullscreen(verseStage); updateMaxButtonUI(true); } else { await exitFullscreen(); updateMaxButtonUI(false); } } catch (err) { console.warn('Fullscreen toggle failed', err); log('Fullscreen not available: ' + (err && err.message ? err.message : err)); } }
verseMaxBtn.addEventListener('click', (ev) => { ev.stopPropagation(); toggleFullscreen(); });
document.addEventListener('fullscreenchange', () => updateMaxButtonUI(isDocumentInFullscreen()));
document.addEventListener('webkitfullscreenchange', () => updateMaxButtonUI(isDocumentInFullscreen()));
document.addEventListener('msfullscreenchange', () => updateMaxButtonUI(isDocumentInFullscreen()));
document.addEventListener('keydown', (ev) => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;
  if (ev.key && ev.key.toLowerCase() === 'f') { ev.preventDefault(); toggleFullscreen(); }
});

/* SpeechRecognition — same behavior */
if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) {
  log('SpeechRecognition not available.');
  startStopBtn.disabled = true;
} else {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recog = new SpeechRecognition();
  recog.lang = 'en-US';
  recog.interimResults = true;
  recog.continuous = true;
  recog.maxAlternatives = 1;
  let listening = false;
  startStopBtn.addEventListener('click', () => {
    try {
      if (!listening) {
        recog.start();
        listening = true;
        startStopBtn.innerText = 'Stop';
        log('Listening…');
        setRecordingState(true);
      } else {
        recog.stop();
      }
    } catch (err) { console.error(err); }
  });
  recog.onresult = async (ev) => {
    let interim = '', final = '';
    for (let i = ev.resultIndex; i < ev.results.length; ++i) {
      const r = ev.results[i];
      if (r.isFinal) final += r[0].transcript + ' ';
      else interim += r[0].transcript + ' ';
    }
    transcriptEl.innerText = (interim ? ('Interim: ' + interim + '\n') : '') + (final ? ('Final: ' + final) : '');
    const stable = final.trim();
    if (stable) {
      const parsed = parseReference(stable);
      if (parsed) { await showVerse(parsed); }
      else { log('Input to Parse:'+stable+':Could not parse reference from final transcript.'); }
    }
  };
  recog.onend = () => { listening = false; startStopBtn.innerText = 'Start'; setRecordingState(false); log('Recognition ended.'); };
  recog.onerror = (e) => { console.warn('SpeechRecognition error', e); listening = false; startStopBtn.innerText = 'Start'; setRecordingState(false); log('SpeechRecognition error: ' + (e && e.error ? e.error : JSON.stringify(e))); };
}

/* keyboard nav & meta toggles (unchanged) */
document.addEventListener('keydown',(ev)=>{ if(ev.key==="ArrowLeft"&&currentRef&&currentRef.verse>1) showVerse({...currentRef,verse:currentRef.verse-1}); if(ev.key==="ArrowRight"&&currentRef) showVerse({...currentRef,verse:currentRef.verse+1}); });
(function() {
  let lastToggle = 0; const DEBOUNCE_MS = 400;
  function tryToggleFromEvent(ev) {
    const now = Date.now(); if (now - lastToggle < DEBOUNCE_MS) return; lastToggle = now;
    const btn = document.getElementById('startStopBtn'); if (!btn || btn.disabled) return; btn.click();
  }
  document.addEventListener('keydown', (ev) => {
    try {
      if (ev.key === 'm') { ev.preventDefault?.(); tryToggleFromEvent(ev); return; }
      if (ev.metaKey && (ev.code === 'Space' || ev.key.toLowerCase() === 'm')) { ev.preventDefault?.(); tryToggleFromEvent(ev); return; }
      if (ev.ctrlKey && ev.altKey && ev.key.toLowerCase() === 'm') { ev.preventDefault?.(); tryToggleFromEvent(ev); return; }
    } catch (err) { console.warn('Meta key toggle error', err); }
  }, { passive: false });
})();

/* File input handler (user can load either English or Malayalam file manually) */
xmlFileInput.addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) { log('No file selected'); return; }
  log('Reading file: ' + f.name);
  try {
    const txt = await f.text();
    const parsed = parseBibleXMLString(txt);
    if (!parsed) { log('Failed to parse selected XML file.'); return; }
    // Heuristic: if file name contains 'malay' or 'ml' treat as ML, else EN
    const lower = (f.name || '').toLowerCase();
    const lang = (lower.includes('malay') || lower.includes('ml')) ? 'ML' : 'EN';
    assignParsedToLang(parsed, lang);
    log('Local XML loaded from file: ' + f.name + ' — Books: ' + Object.keys((lang === 'EN' ? englishXML.data : malayalamXML.data)).length);
    // If the loaded file matches currentLanguage assign pointers and show currentRef.
    if (lang === currentLanguage) {
      bibleData = (lang === 'EN') ? englishXML.data : malayalamXML.data;
      bibleBookNames = (lang === 'EN') ? englishXML.bookNames : malayalamXML.bookNames;
      bibleEnglishToKeyMap = (lang === 'EN') ? englishXML.englishToKeyMap : malayalamXML.englishToKeyMap;
      if (currentRef) showVerse(currentRef);
    }
  } catch (e) {
    console.error(e); log('Error reading file: ' + (e && e.message ? e.message : e));
  } finally {
    xmlFileInput.value = '';
  }
});

/* Load both XMLs at startup (attempt fetch for both concurrently). If either fails, we leave that slot null and user can click Load local XML or pick a file. */
async function preloadBothXml() {
  log('Preloading English and Malayalam XMLs (if available)...');
  const [enParsed, mlParsed] = await Promise.all([
    fetchAndParse('English_Catholic_XML.xml'),
    fetchAndParse('malayalam_bible.xml')
  ]);
  if (enParsed) {
    assignParsedToLang(enParsed, 'EN');
    console.log('✅ English XML parsed — books:', Object.keys(englishXML.data).length);
  } else {
    console.log('⚠️ English XML not available on server.');
  }
  if (mlParsed) {
    assignParsedToLang(mlParsed, 'ML');
    console.log('✅ Malayalam XML parsed — books:', Object.keys(malayalamXML.data).length);
  } else {
    console.log('⚠️ Malayalam XML not available on server.');
  }

  // Default pointers: prefer English if available, else Malayalam, else null
  if (englishXML && englishXML.data) {
    currentLanguage = 'EN';
    bibleData = englishXML.data;
    bibleBookNames = englishXML.bookNames;
    bibleEnglishToKeyMap = englishXML.englishToKeyMap;
    langBtn && (langBtn.innerText = 'EN / ML');
    log('Defaulting to English XML.');
  } else if (malayalamXML && malayalamXML.data) {
    currentLanguage = 'ML';
    bibleData = malayalamXML.data;
    bibleBookNames = malayalamXML.bookNames;
    bibleEnglishToKeyMap = malayalamXML.englishToKeyMap;
    langBtn && (langBtn.innerText = 'ML / EN');
    log('Defaulting to Malayalam XML.');
  } else {
    log('No local XMLs found. Click "Load local XML" to open a file from disk.');
  }

  // If user already has a requested currentRef show it; otherwise show Genesis 1:1 as before if english available.
  if (currentRef) showVerse(currentRef);
  else if (currentLanguage === 'EN') showVerse({book: "Genesis", chapter: 1, verse: 1});
  else if (currentLanguage === 'ML') {
    // try to resolve Genesis via englishToKeyMap if possible
    if (bibleEnglishToKeyMap && bibleEnglishToKeyMap['genesis']) {
      const xmlKey = bibleEnglishToKeyMap['genesis'];
      if (bibleData && bibleData[xmlKey] && bibleData[xmlKey]['1'] && bibleData[xmlKey]['1']['1']) {
        verseRefEl.innerText = `${xmlKey} 1:1`;
        verseBodyEl.innerText = bibleData[xmlKey]['1']['1'];
        verseBodyEl.style.fontSize = baseFontSize + 'px';
      }
    }
  }
}

/* Load local button handler: if both preloads failed for that lang allow file pick */
loadLocalBtn.addEventListener('click', async () => {
  // If current language slot exists do nothing and show message; otherwise prompt file pick
  if (currentLanguage === 'EN' && englishXML && englishXML.data) {
    log('English XML already loaded.');
    return;
  }
  if (currentLanguage === 'ML' && malayalamXML && malayalamXML.data) {
    log('Malayalam XML already loaded.');
    return;
  }
  // Prompt user to pick whichever file they want to load; hint shows expected filename
  promptUserToSelectXmlFile((currentLanguage === 'EN') ? 'English_Catholic_XML.xml' : 'malayalam_bible.xml');
});

function promptUserToSelectXmlFile(filenameHint) {
  log('Please select the bible XML file' + (filenameHint ? (' (e.g. '+filenameHint+')') : '') + ' from disk.');
  xmlFileInput.click();
}

/* Language toggle: just change pointers to in-memory structures, no re-fetch */
langBtn.addEventListener('click', async () => {
  if (currentLanguage === 'EN') {
    // Switch to Malayalam if loaded, else prompt user to pick ML file
    if (malayalamXML && malayalamXML.data) {
      currentLanguage = 'ML';
      bibleData = malayalamXML.data;
      bibleBookNames = malayalamXML.bookNames;
      bibleEnglishToKeyMap = malayalamXML.englishToKeyMap;
      langBtn.innerText = 'ML / EN';
      log('Language switched to Malayalam (in-memory).');
      if (currentRef) showVerse(currentRef);
    } else {
      // Ask user to load malayalam file
      log('Malayalam XML not loaded. Please select malayalam_bible.xml.');
      promptUserToSelectXmlFile('malayalam_bible.xml');
    }
  } else {
    // Switch to English if loaded, else prompt to load
    if (englishXML && englishXML.data) {
      currentLanguage = 'EN';
      bibleData = englishXML.data;
      bibleBookNames = englishXML.bookNames;
      bibleEnglishToKeyMap = englishXML.englishToKeyMap;
      langBtn.innerText = 'EN / ML';
      log('Language switched to English (in-memory).');
      if (currentRef) showVerse(currentRef);
    } else {
      log('English XML not loaded. Please select English_Catholic_XML.xml.');
      promptUserToSelectXmlFile('English_Catholic_XML.xml');
    }
  }
});

/* Initialize: preload both XML files */
(async function init(){
  await preloadBothXml();
})();
</script>
