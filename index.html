<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Voice — Continuous</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Inter, system-ui, Arial;
      margin: 20px;
      background: #071028;
      color: #e6eef6;
    }
    .controls { margin-bottom: 12px }
    button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 0;
      background: #1f2937;
      color: #fff;
      cursor: pointer;
      margin-right: 6px;
    }
    #status { margin-left: 10px; color: #9aa4b2 }
    #transcript { margin-bottom: 10px; color: #9aa4b2 }
    .verse-stage {
      padding: 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      min-height: 220px;
    }
    .verse-ref {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 8px;
      color: #ffd166;
    }
    .verse-body {
      font-size: 28px;
      line-height: 1.25;
    }
    #log { margin-top: 10px; color: #9aa4b2 }
  </style>
</head>
<body>
  <div class="controls">
    <button id="startStopBtn">Start</button>
    <button id="clearBtn">Clear</button>
    <span id="status">Idle</span>
  </div>

  <div id="transcript">Heard: —</div>

  <div class="verse-stage">
    <div class="verse-ref" id="verseRef">Ready</div>
    <div class="verse-body" id="verseBody"></div>
  </div>

  <div id="log">Log: Ready</div>

<script>
const BOOK_ALIASES = {
  // Pentateuch
  "genesis":"Genesis",
  "exodus":"Exodus",
  "leviticus":"Leviticus",
  "numbers":"Numbers",
  "deuteronomy":"Deuteronomy",

  // History
  "joshua":"Joshua",
  "judges":"Judges",
  "ruth":"Ruth",

  "1 samuel":"1 Samuel","one samuel":"1 Samuel","first samuel":"1 Samuel",
  "2 samuel":"2 Samuel","two samuel":"2 Samuel","second samuel":"2 Samuel",

  "1 kings":"1 Kings","one kings":"1 Kings","first kings":"1 Kings",
  "2 kings":"2 Kings","two kings":"2 Kings","second kings":"2 Kings",

  "1 chronicles":"1 Chronicles","one chronicles":"1 Chronicles","first chronicles":"1 Chronicles",
  "2 chronicles":"2 Chronicles","two chronicles":"2 Chronicles","second chronicles":"2 Chronicles",

  "ezra":"Ezra",
  "nehemiah":"Nehemiah",
  "esther":"Esther",

  // Wisdom / Poetry
  "job":"Job",
  "psalm":"Psalms","psalms":"Psalms",
  "proverbs":"Proverbs",
  "ecclesiastes":"Ecclesiastes",
  "song of solomon":"Song of Solomon","song of songs":"Song of Solomon",

  // Major Prophets
  "isaiah":"Isaiah",
  "jeremiah":"Jeremiah",
  "lamentations":"Lamentations",
  "ezekiel":"Ezekiel",
  "daniel":"Daniel",

  // Minor Prophets
  "hosea":"Hosea",
  "joel":"Joel",
  "amos":"Amos",
  "obadiah":"Obadiah",
  "jonah":"Jonah",
  "micah":"Micah",
  "nahum":"Nahum",
  "habakkuk":"Habakkuk",
  "zephaniah":"Zephaniah",
  "haggai":"Haggai",
  "zechariah":"Zechariah",
  "malachi":"Malachi",

  //Common Words
  "was":"Verse",

  // Gospels & Acts
  "matthew":"Matthew",
  "mark":"Mark",
  "luke":"Luke",
  "john":"John",
  "acts":"Acts","acts of the apostles":"Acts",

  // Pauline Epistles
  "romans":"Romans",

  "1 corinthians":"1 Corinthians","one corinthians":"1 Corinthians","first corinthians":"1 Corinthians",
  "2 corinthians":"2 Corinthians","two corinthians":"2 Corinthians","second corinthians":"2 Corinthians",

  "galatians":"Galatians",
  "ephesians":"Ephesians",
  "Efficient":"Ephesians",
  "efficient":"Ephesians",
  "Efficiency":"Ephesians",
  "efficiency":"Ephesians",
  "philippians":"Philippians",
  "colossians":"Colossians",

  "1 thessalonians":"1 Thessalonians","one thessalonians":"1 Thessalonians","first thessalonians":"1 Thessalonians",
  "2 thessalonians":"2 Thessalonians","two thessalonians":"2 Thessalonians","second thessalonians":"2 Thessalonians",

  "1 timothy":"1 Timothy","one timothy":"1 Timothy","first timothy":"1 Timothy",
  "2 timothy":"2 Timothy","two timothy":"2 Timothy","second timothy":"2 Timothy",

  "titus":"Titus",
  "philemon":"Philemon",

  // General Epistles
  "hebrews":"Hebrews",
  "james":"James",

  "1 peter":"1 Peter","one peter":"1 Peter","first peter":"1 Peter",
  "2 peter":"2 Peter","two peter":"2 Peter","second peter":"2 Peter",

  "1 john":"1 John","one john":"1 John","first john":"1 John",
  "2 john":"2 John","two john":"2 John","second john":"2 John",
  "3 john":"3 John","three john":"3 John","third john":"3 John",

  "jude":"Jude",

  // Prophecy
  "revelation":"Revelation","revelations":"Revelation","apocalypse":"Revelation"
};

/* number words → numbers */
const WORD_NUM = {
  'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,
  'eleven':11,'twelve':12,'thirteen':13,'fourteen':14,'fifteen':15,'sixteen':16,
  'seventeen':17,'eighteen':18,'nineteen':19,'twenty':20,'thirty':30,'forty':40,
  'fifty':50,'sixty':60,'seventy':70,'eighty':80,'ninety':90,
  'first':1,'second':2,'third':3
};

function normalizeSpoken(s){
  if(!s) return '';
  return s.trim()
    .replace(/\bchapter\b/gi,' ')
    .replace(/\bverse\b/gi,' ')
    .replace(/[.,!?]/g,' ')
    .replace(/\s+/g,' ')
    .toLowerCase()
    .trim();
}
function wordsToNumber(phrase){
  if(!phrase) return null;
  if(!isNaN(Number(phrase))) return Number(phrase);
  let total = 0;
  phrase.split(/\s+/).forEach(p=>{
    if(WORD_NUM[p]!=null) total+=WORD_NUM[p];
  });
  return total||null;
}
function detectBookFromTokens(tokens){
  const maxLen=Math.min(3,tokens.length);
  for(let len=maxLen;len>=1;len--){
    const cand=tokens.slice(0,len).join(' ');
    if(BOOK_ALIASES[cand]) return {book:BOOK_ALIASES[cand],consumed:len};
  }
  return null;
}

/* --- Parse all references from a spoken string --- */
function parseAllReferences(raw){
  const norm=normalizeSpoken(raw);
  if(!norm) return [];
  const tokens=norm.split(/\s+/).filter(Boolean);
  const results=[];
  let idx=0;
  while(idx<tokens.length){
    const slice=tokens.slice(idx);
    const bookMatch=detectBookFromTokens(slice);
    if(!bookMatch){ idx++; continue; }
    const book=bookMatch.book;
    let j=idx+bookMatch.consumed;
    const rest=tokens.slice(j).join(' ');
    const colon=rest.match(/(\d+)\s*:\s*(\d+)/);
    if(colon){
      results.push({book,chapter:+colon[1],verse:+colon[2]});
      idx=j+colon[0].split(/\s+/).length; continue;
    }
    const nums=[];
    for(let k=0;k<3 && j+k<tokens.length;k++){
      const t=tokens[j+k];
      if(/\d+/.test(t)) nums.push(+t);
      else {
        const wn=wordsToNumber(t);
        if(wn) nums.push(wn);
      }
      if(nums.length>=2) break;
    }
    if(nums.length>=2){ results.push({book,chapter:nums[0],verse:nums[1]}); idx=j+2; continue; }
    if(nums.length===1){ results.push({book,chapter:nums[0],verse:1}); idx=j+1; continue; }
    idx=j;
  }
  return results;
}

/* --- DOM --- */
const startStopBtn=document.getElementById('startStopBtn');
const clearBtn=document.getElementById('clearBtn');
const transcriptEl=document.getElementById('transcript');
const verseRefEl=document.getElementById('verseRef');
const verseBodyEl=document.getElementById('verseBody');
const logEl=document.getElementById('log');
const statusEl=document.getElementById('status');

let recog=null,listening=false,lastFoundRef=null,debounceFetch=0;
const FETCH_DEBOUNCE_MS=1200;

function log(msg){ logEl.innerText='Log: '+msg; }

/* SpeechRecognition setup */
function createRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  const r=new SR();
  r.lang='en-US'; r.interimResults=true; r.maxAlternatives=1; r.continuous=true;
  return r;
}
function startRecognition(){
  if(listening) return;
  recog=createRecognition();
  if(!recog){ log('SpeechRecognition not supported'); return; }
  recog.onstart=()=>{listening=true;statusEl.innerText='Listening…';startStopBtn.innerText='Stop';};
  recog.onend=()=>{listening=false;statusEl.innerText='Restarting…';startStopBtn.innerText='Start';setTimeout(()=>startRecognition(),500);};
  recog.onresult=(ev)=>{
    let interim='',finalText='';
    for(let i=0;i<ev.results.length;i++){
      const res=ev.results[i];
      if(res.isFinal) finalText+=res[0].transcript+' ';
      else interim+=res[0].transcript+' ';
    }
    const display=(finalText+interim).trim();
    transcriptEl.innerText='Heard: "'+display+'"';
    const parsedArr=parseAllReferences(display);
    if(parsedArr.length){
      const parsed=parsedArr[parsedArr.length-1]; // pick last match
      verseRefEl.innerText=parsed.book+' '+parsed.chapter+':'+parsed.verse;
      const key=parsed.book+'|'+parsed.chapter+'|'+parsed.verse;
      const now=Date.now();
      if(key!==lastFoundRef && now-debounceFetch>FETCH_DEBOUNCE_MS){
        debounceFetch=now;lastFoundRef=key;
        fetchVerse(parsed);
      }
    }
  };
  recog.start();
}
function stopRecognition(){
  if(recog) try{recog.stop();}catch(e){}
  listening=false;statusEl.innerText='Idle';startStopBtn.innerText='Start';
}
async function fetchVerse(ref){
  try{
    verseBodyEl.innerText='Loading…';
    const r=`${ref.book} ${ref.chapter}:${ref.verse}`;
    const resp=await fetch(`https://bible-api.com/${encodeURIComponent(r)}`);
    const data=await resp.json();
    verseRefEl.innerText=data.reference+(data.translation_id?` — ${data.translation_id}`:'');
    verseBodyEl.innerText=data.text.trim();
    statusEl.innerText='Found: '+r; log('Verse loaded.');
  }catch(e){ log('Fetch error: '+e.message); }
}

/* buttons */
startStopBtn.addEventListener('click',()=>{if(!listening)startRecognition();else stopRecognition();});
clearBtn.addEventListener('click',()=>{transcriptEl.innerText='Heard: —';verseRefEl.innerText='Ready';verseBodyEl.innerText='';lastFoundRef=null;});
</script>
</body>
</html>
