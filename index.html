<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Voice</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #0f1724;
      --accent: #ffd166;
      --muted: #9aa4b2;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071028 0%, #0f1724 100%);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;color:#e6eef6}
    .wrap{max-width:1200px;margin:28px auto;padding:20px}
    .top{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:18px}
    .brand{display:flex;gap:14px;align-items:center}
    .logo{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;font-weight:800;color:white;font-family:"Playfair Display",serif;font-size:28px}
    h1{margin:0;font-family:"Playfair Display",serif;font-size:22px;color:var(--accent)}
    p.lead{margin:0;color:var(--muted);font-size:14px}

    .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
    .btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);color:var(--accent);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
    .btn.secondary{color:#e6eef6}
    .btn.icon{font-size:18px;padding:10px 12px}

    .panel{background:rgba(255,255,255,0.02);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center}

    .transcript{color:var(--muted);font-size:14px}
    .log{color:var(--muted);font-size:14px}

    .verse-stage{margin-top:6px;flex:1;display:flex;align-items:center;justify-content:center;padding:22px;border-radius:12px;background:rgba(255,255,255,0.02);min-height:280px;text-align:center}
    .verse-ref{font-family:"Playfair Display",serif;color:var(--accent);font-weight:700;font-size:34px;margin-bottom:8px}
    .verse-body{font-size:44px;line-height:1.15;font-weight:600;color:#f7fbff;text-shadow:0 6px 20px rgba(0,0,0,0.6)}

    @media (max-width:900px){
      .verse-ref{font-size:26px}
      .verse-body{font-size:28px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">BV</div>
        <div>
          <h1>Bible Voice</h1>
          <p class="lead">Speak a reference. Use ← / → or buttons to navigate verses.</p>
        </div>
      </div>

      <div class="controls">
        <button id="startStopBtn" class="btn">Start</button>
        <button id="prevBtn" class="btn secondary icon">◀ Prev</button>
        <button id="nextBtn" class="btn secondary icon">Next ▶</button>
        <button id="bigMinus" class="btn secondary">A-</button>
        <button id="bigPlus" class="btn">A+</button>
      </div>
    </div>

    <div class="panel">
      <div class="transcript" id="transcript">Heard: —</div>
      <div class="verse-stage">
        <div>
          <div class="verse-ref" id="verseRef">No verse loaded</div>
          <div class="verse-body" id="verseBody">Say "Genesis chapter 3 verse 6"</div>
        </div>
      </div>
      <div class="log" id="log">Ready</div>
    </div>
  </div>

<script>
/* ===== book mapping (subset for demo) ===== */
const BOOK_ALIASES = {
  // Pentateuch
  "genesis":"Genesis",
  "exodus":"Exodus",
  "leviticus":"Leviticus",
  "numbers":"Numbers",
  "deuteronomy":"Deuteronomy",

  // History
  "joshua":"Joshua",
  "judges":"Judges",
  "ruth":"Ruth",

  "1 samuel":"1 Samuel","one samuel":"1 Samuel","first samuel":"1 Samuel",
  "2 samuel":"2 Samuel","two samuel":"2 Samuel","second samuel":"2 Samuel",

  "1 kings":"1 Kings","one kings":"1 Kings","first kings":"1 Kings",
  "2 kings":"2 Kings","two kings":"2 Kings","second kings":"2 Kings",

  "1 chronicles":"1 Chronicles","one chronicles":"1 Chronicles","first chronicles":"1 Chronicles",
  "2 chronicles":"2 Chronicles","two chronicles":"2 Chronicles","second chronicles":"2 Chronicles",

  "ezra":"Ezra",
  "nehemiah":"Nehemiah",
  "esther":"Esther",

  // Wisdom / Poetry
  "job":"Job",
  "psalm":"Psalms","psalms":"Psalms",
  "proverbs":"Proverbs",
  "ecclesiastes":"Ecclesiastes",
  "song of solomon":"Song of Solomon","song of songs":"Song of Solomon",

  // Major Prophets
  "isaiah":"Isaiah",
  "jeremiah":"Jeremiah",
  "lamentations":"Lamentations",
  "ezekiel":"Ezekiel",
  "daniel":"Daniel",

  // Minor Prophets
  "hosea":"Hosea",
  "joel":"Joel",
  "amos":"Amos",
  "obadiah":"Obadiah",
  "jonah":"Jonah",
  "micah":"Micah",
  "nahum":"Nahum",
  "habakkuk":"Habakkuk",
  "zephaniah":"Zephaniah",
  "haggai":"Haggai",
  "zechariah":"Zechariah",
  "malachi":"Malachi",

  // Gospels & Acts
  "matthew":"Matthew",
  "mark":"Mark",
  "luke":"Luke",
  "john":"John",
  "acts":"Acts","acts of the apostles":"Acts",

  // Pauline Epistles
  "romans":"Romans",

  "1 corinthians":"1 Corinthians","one corinthians":"1 Corinthians","first corinthians":"1 Corinthians",
  "2 corinthians":"2 Corinthians","two corinthians":"2 Corinthians","second corinthians":"2 Corinthians",

  "galatians":"Galatians",
  "ephesians":"Ephesians",
  "philippians":"Philippians",
  "colossians":"Colossians",

  "1 thessalonians":"1 Thessalonians","one thessalonians":"1 Thessalonians","first thessalonians":"1 Thessalonians",
  "2 thessalonians":"2 Thessalonians","two thessalonians":"2 Thessalonians","second thessalonians":"2 Thessalonians",

  "1 timothy":"1 Timothy","one timothy":"1 Timothy","first timothy":"1 Timothy",
  "2 timothy":"2 Timothy","two timothy":"2 Timothy","second timothy":"2 Timothy",

  "titus":"Titus",
  "philemon":"Philemon",

  // General Epistles
  "hebrews":"Hebrews",
  "james":"James",

  "1 peter":"1 Peter","one peter":"1 Peter","first peter":"1 Peter",
  "2 peter":"2 Peter","two peter":"2 Peter","second peter":"2 Peter",

  "1 john":"1 John","one john":"1 John","first john":"1 John",
  "2 john":"2 John","two john":"2 John","second john":"2 John",
  "3 john":"3 John","three john":"3 John","third john":"3 John",

  "jude":"Jude",

  // Prophecy
  "revelation":"Revelation","revelations":"Revelation","apocalypse":"Revelation"
};


function normalizeSpoken(s){return s.trim().replace(/\bchapter\b/gi,' ').replace(/\bverse\b/gi,' ').replace(/\s+/g,' ').toLowerCase();}
function wordsToNumber(w){const m={'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10};if(!isNaN(Number(w))) return Number(w);return m[w]||null;}

function parseReference(text){
  const s = normalizeSpoken(text);const tokens = s.split(' ').filter(Boolean);
  for(let len=Math.min(3,tokens.length);len>=1;len--){
    const candidate = tokens.slice(0,len).join(' ');
    if(BOOK_ALIASES[candidate]){
      const book = BOOK_ALIASES[candidate];const rest = tokens.slice(len).join(' ').trim();
      const colon=rest.match(/(\d+):(\d+)/);if(colon)return{book,chapter:+colon[1],verse:+colon[2]};
      const nums=rest.split(/\s+/);if(nums.length>=2){const c=+nums[0]||wordsToNumber(nums[0]);const v=+nums[1]||wordsToNumber(nums[1]);if(c&&v)return{book,chapter:c,verse:v};}
    }
  }return null;
}

const startStopBtn=document.getElementById('startStopBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const transcriptEl=document.getElementById('transcript');
const verseRefEl=document.getElementById('verseRef');
const verseBodyEl=document.getElementById('verseBody');
const logEl=document.getElementById('log');
const bigPlus=document.getElementById('bigPlus');
const bigMinus=document.getElementById('bigMinus');

let currentRef=null;baseFontSize=44;
function log(msg){logEl.innerText=msg;}

async function showVerse(parsed){
  try{
    const ref=`${parsed.book} ${parsed.chapter}:${parsed.verse}`;
    const resp=await fetch(`https://bible-api.com/${encodeURIComponent(ref)}`);
    if(!resp.ok)throw new Error(resp.status);
    const data=await resp.json();
    verseRefEl.innerText=data.reference+(data.translation_id?` — ${data.translation_id}`:'');
    verseBodyEl.innerText=data.text.trim();
    verseBodyEl.style.fontSize=baseFontSize+'px';
    currentRef=parsed;
    log('Verse loaded.');
  }catch(e){log('Error: '+e.message);}
}

prevBtn.addEventListener('click',()=>{if(currentRef&&currentRef.verse>1)showVerse({...currentRef,verse:currentRef.verse-1});});
nextBtn.addEventListener('click',()=>{if(currentRef)showVerse({...currentRef,verse:currentRef.verse+1});});
bigPlus.addEventListener('click',()=>{baseFontSize=Math.min(120,baseFontSize+8);verseBodyEl.style.fontSize=baseFontSize+'px';});
bigMinus.addEventListener('click',()=>{baseFontSize=Math.max(18,baseFontSize-6);verseBodyEl.style.fontSize=baseFontSize+'px';});

/* SpeechRecognition */
if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){log('SpeechRecognition not available.');startStopBtn.disabled=true;}
else{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;const recog=new SpeechRecognition();
  recog.lang='en-US';recog.interimResults=false;recog.maxAlternatives=1;recog.continuous=false;let listening=false;
  startStopBtn.addEventListener('click',()=>{if(!listening){recog.start();listening=true;startStopBtn.innerText='Stop';log('Listening…');}else{recog.stop();}});
  recog.onresult=async(ev)=>{const text=ev.results[0][0].transcript;transcriptEl.innerText='Heard: "'+text+'"';const parsed=parseReference(text);if(parsed)await showVerse(parsed);else log('Could not parse reference.');};
  recog.onend=()=>{listening=false;startStopBtn.innerText='Start';};
}
document.addEventListener('keydown',(ev)=>{if(ev.key==="ArrowLeft"&&currentRef&&currentRef.verse>1)showVerse({...currentRef,verse:currentRef.verse-1});if(ev.key==="ArrowRight"&&currentRef)showVerse({...currentRef,verse:currentRef.verse+1});});
</script>
</body>
</html>
