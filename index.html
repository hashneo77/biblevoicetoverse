<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Voice</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0f1724;
      --text-dark: #e6eef6;
      --muted-dark: #9aa4b2;
      --accent-dark: #ffd166;

      --bg-light: #ffffff;
      --text-light: #1a1a1a;
      --muted-light: #555555;
      --accent-light: #0077cc;
    }

    body {
      height:100%; margin:0;
      font-family: Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial;
      transition: background 0.3s, color 0.3s;
    }

    /* Dark theme */
    body[data-theme="dark"] {
      background: linear-gradient(180deg, #071028 0%, var(--bg-dark) 100%);
      color: var(--text-dark);
    }

    /* Light theme */
    body[data-theme="light"] {
      background: var(--bg-light);
      color: var(--text-light);
    }

    .wrap { max-width:1200px; margin:28px auto; padding:20px }

    .top { display:flex; gap:18px; align-items:center; justify-content:space-between; margin-bottom:18px }

    .brand { display:flex; gap:14px; align-items:center }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background-image: url("logo.png");
      background-size: cover;
      background-position: center;
    }

    h1 { margin:0; font-family:"Playfair Display",serif; font-size:22px }
    p.lead { margin:0; font-size:14px }

    .controls { display:flex;flex-wrap:wrap;gap:12px;align-items:center }

    .btn {
      border:1px solid transparent;
      padding:10px 16px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
      transition: background .2s, color .2s, border .2s;
    }
    body[data-theme="dark"] .btn {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.1);
      color: var(--accent-dark);
    }
    body[data-theme="light"] .btn {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.1);
      color: var(--accent-light);
    }

    .btn.secondary { color: inherit }
    .btn.icon { font-size:18px; padding:10px 12px }

    .panel {
      border-radius:14px; padding:18px;
      display:flex;flex-direction:column;gap:14px;align-items:center;
      transition: background .3s;
    }
    body[data-theme="dark"] .panel { background: rgba(255,255,255,0.02) }
    body[data-theme="light"] .panel { background: rgba(0,0,0,0.02) }

    .transcript, .log { font-size:14px; }

    /* Make the verse-stage position relative so controls inside it can be absolutely placed */
    .verse-stage {
      margin-top:6px;flex:1;display:flex;align-items:center;justify-content:center;
      padding:22px;border-radius:12px;min-height:550px;text-align:center;
      width:90%;       /* 90% of the parent width */
      max-width:1250px; /* corrected to include px */
      position: relative; /* NEW: for the maximize button */
      overflow: hidden;
    }
    body[data-theme="dark"] .verse-stage { background: rgba(255,255,255,0.02) }
    body[data-theme="light"] .verse-stage { background: rgba(0,0,0,0.02) }

    /* When verse-stage is logically "expanded" (we also request browser fullscreen) make the content larger */
    .verse-stage.fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      min-height: unset !important;
      padding: 40px !important;
      border-radius: 0 !important;
      display:flex;
      align-items:center;justify-content:center;
    }

    .verse-ref { font-family:"Playfair Display",serif;font-weight:700;font-size:34px;margin-bottom:8px }
    .verse-body { font-size:44px;line-height:1.15;font-weight:600 }

    body[data-theme="dark"] .verse-ref { color: var(--accent-dark) }
    body[data-theme="dark"] .verse-body { color: #f7fbff; text-shadow:0 6px 20px rgba(0,0,0,0.6) }

    body[data-theme="light"] .verse-ref { color: var(--accent-light) }
    body[data-theme="light"] .verse-body { color: var(--text-light) }

    @media (max-width:900px){
      .verse-ref{font-size:26px}
      .verse-body{font-size:28px}
    }

    /* hidden file input visually */
    #xmlFileInput { display:none; }

    /* Mic icon next to Start button */
    .mic-icon {
      display: inline-block;
      width: 22px;
      height: 22px;
      margin-left: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.08);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06);
      vertical-align: middle;
      position: relative;
      transition: background .15s, box-shadow .15s, transform .15s;
      pointer-events: none; /* decorative only */
    }

    /* small mic glyph inside */
    .mic-icon::after {
      content: '🎤';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      filter: grayscale(100%); /* grey when inactive */
      transition: filter .15s;
    }

    /* Recording state — red background + pulsing */
    .mic-icon.recording {
      background: linear-gradient(135deg, #ff5a5a, #d60000);
      box-shadow: 0 0 0 6px rgba(214,0,0,0.08), 0 0 18px rgba(214,0,0,0.12);
      transform: scale(1.02);
      animation: micPulse 1.2s infinite ease-in-out;
    }
    .mic-icon.recording::after {
      filter: none; /* full color emoji */
    }

    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(214,0,0,0.12); }
      70% { box-shadow: 0 0 0 10px rgba(214,0,0,0); }
      100% { box-shadow: 0 0 0 0 rgba(214,0,0,0); }
    }

    /* Maximize button inside verse-stage (top-right) */
    .verse-max-btn {
      position: absolute;
      right: 14px;
      top: 14px;
      z-index: 30;
      background: rgba(0,0,0,0.06);
      border: 1px solid rgba(0,0,0,0.08);
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-weight:700;
      backdrop-filter: blur(4px);
    }
    body[data-theme="dark"] .verse-max-btn {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.08);
      color: var(--accent-dark);
    }
    body[data-theme="light"] .verse-max-btn {
      background: rgba(0,0,0,0.04);
      border-color: rgba(0,0,0,0.06);
      color: var(--accent-light);
    }

    .verse-max-btn:focus { outline: 3px solid rgba(0,0,0,0.08); }

    /* accessible hidden label for screen-readers if you want one */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
      border: 0; padding: 0; margin: -1px;
    }
  </style>
</head>
<body data-theme="light">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <h1>Bible Voice</h1>
          <p class="lead">Speak a reference. Use ← / → or buttons to navigate verses.</p>
        </div>
      </div>

      <div class="controls">
        <button id="startStopBtn" class="btn">Start</button>
        <!-- mic indicator placed beside Start -->
        <span id="micIcon" class="mic-icon" role="img" aria-hidden="true" title="Microphone status"></span>

        <button id="prevBtn" class="btn secondary icon">◀</button>
        <button id="nextBtn" class="btn secondary icon">▶</button>
        <button id="bigMinus" class="btn secondary">A-</button>
        <button id="bigPlus" class="btn">A+</button>
        <button id="themeBtn" class="btn">🌞/🌙</button>
        <button id="loadLocalBtn" class="btn secondary">Load local XML</button>
      </div>
    </div>

    <div class="panel">
      <div class="transcript" id="transcript"></div>

      <!-- Verse stage: maximize button is here -->
      <div class="verse-stage" id="verseStage">
        <!-- maximize button -->
        <button id="verseMaxBtn" class="verse-max-btn" aria-pressed="false" title="Maximize (F)">⤢</button>

        <div>
          <div class="verse-ref" id="verseRef">Jesus Loves You</div>
          <div class="verse-body" id="verseBody"></div>
        </div>
      </div>

      <div class="log" id="log">Ready</div>
    </div>
  </div>

  <!-- hidden file input for manual-loading fallback -->
  <input id="xmlFileInput" type="file" accept=".xml,.XML" />

<script>
/* === Aliases (shortened here, plug in the full BOOK_ALIASES we built earlier) === */
const BOOK_ALIASES = {
  "genesis":"Genesis","exodus":"Exodus","leviticus":"Leviticus","numbers":"Numbers","deuteronomy":"Deuteronomy",
  "joshua":"Joshua","judges":"Judges","ruth":"Ruth",
  "1 samuel":"1 Samuel","one samuel":"1 Samuel","first samuel":"1 Samuel",
  "2 samuel":"2 Samuel","two samuel":"2 Samuel","second samuel":"2 Samuel",
  "1 kings":"1 Kings","one kings":"1 Kings","first kings":"1 Kings",
  "2 kings":"2 Kings","two kings":"2 Kings","second kings":"2 Kings",
  "1 chronicles":"1 Chronicles","one chronicles":"1 Chronicles","first chronicles":"1 Chronicles",
  "2 chronicles":"2 Chronicles","two chronicles":"2 Chronicles","second chronicles":"2 Chronicles",
  "ezra":"Ezra","nehemiah":"Nehemiah","esther":"Esther",
  "job":"Job","psalm":"Psalms","psalms":"Psalms","proverbs":"Proverbs","ecclesiastes":"Ecclesiastes",
  "song of solomon":"Song of Solomon","song of songs":"Song of Solomon",
  "isaiah":"Isaiah","jeremiah":"Jeremiah","lamentations":"Lamentations","ezekiel":"Ezekiel","daniel":"Daniel",
  "hosea":"Hosea","joel":"Joel","amos":"Amos","obadiah":"Obadiah","jonah":"Jonah","micah":"Micah","nahum":"Nahum","habakkuk":"Habakkuk","zephaniah":"Zephaniah","haggai":"Haggai","zechariah":"Zechariah","malachi":"Malachi",
  "matthew":"Matthew","mark":"Mark","luke":"Luke","john":"John","acts":"Acts","acts of the apostles":"Acts",
  "romans":"Romans",
  "1 corinthians":"1 Corinthians","one corinthians":"1 Corinthians","first corinthians":"1 Corinthians",
  "2 corinthians":"2 Corinthians","two corinthians":"2 Corinthians","second corinthians":"2 Corinthians",
  "galatians":"Galatians","ephesians":"Ephesians","philippians":"Philippians",
  "philippines":"Philippians","colossians":"Colossians",
  "1 thessalonians":"1 Thessalonians","one thessalonians":"1 Thessalonians","first thessalonians":"1 Thessalonians",
  "2 thessalonians":"2 Thessalonians","two thessalonians":"2 Thessalonians","second thessalonians":"2 Thessalonians",
  "1 timothy":"1 Timothy","one timothy":"1 Timothy","first timothy":"1 Timothy",
  "2 timothy":"2 Timothy","two timothy":"2 Timothy","second timothy":"2 Timothy",
  "titus":"Titus","philemon":"Philemon","hebrews":"Hebrews","james":"James",
  "1 peter":"1 Peter","one peter":"1 Peter","first peter":"1 Peter",
  "2 peter":"2 Peter","two peter":"2 Peter","second peter":"2 Peter",
  "1 john":"1 John","one john":"1 John","first john":"1 John",
  "2 john":"2 John","two john":"2 John","second john":"2 John",
  "3 john":"3 John","three john":"3 John","third john":"3 John",
  "Jude":"Jude",
  "jude":"Jude","revelation":"Revelation","revelations":"Revelation","apocalypse":"Revelation",

  /* --- Deuterocanonical / Catholic books & common aliases --- */
  "tobit":"Tobit","tobias":"Tobit",
  "judith":"Judith",
  "wisdom":"Wisdom","wisdom of solomon":"Wisdom","wisdom of the solomon":"Wisdom",
  "sirach":"Sirach","ecclesiasticus":"Sirach","ben sira":"Sirach",
  "baruch":"Baruch","letter of jeremiah":"Baruch","jeremiah letter":"Baruch",
  "1 maccabees":"1 Maccabees","one maccabees":"1 Maccabees","first maccabees":"1 Maccabees","1 mac":"1 Maccabees","first mac":"1 Maccabees",
  "2 maccabees":"2 Maccabees","two maccabees":"2 Maccabees","second maccabees":"2 Maccabees","2 mac":"2 Maccabees","second mac":"2 Maccabees",
  "efficiency":"Ephesians",
  "Efficiency":"Ephesians",
  "efficience":"Ephesians",
  "Sirac":"Sirach",
  "sira":"Sirach",
  "Sira":"Sirach",
  "chirag":"Sirach",
  "Chirag":"Sirach",
  /* Additions commonly embedded in Esther / Daniel (map to helpful labels) */
  "additions to esther":"Esther (Additions)","esther additions":"Esther (Additions)","rest of esther":"Esther (Additions)",

  /* Daniel additions */
  "susanna":"Daniel (Susanna)","susannah":"Daniel (Susanna)",
  "bel and the dragon":"Daniel (Bel and the Dragon)","bel and dragon":"Daniel (Bel and the Dragon)",
  "prayer of azariah":"Daniel (Prayer of Azariah)","song of the three children":"Daniel (Song of the Three Holy Children)",
  "song of the three young men":"Daniel (Song of the Three Holy Children)","song of the three":"Daniel (Song of the Three Holy Children)"
};

function normalizeSpoken(s){return s.trim().replace(/\bchapter\b/gi,' ').replace(/\bverse\b/gi,' ').replace(/\s+/g,' ').toLowerCase();}
function wordsToNumber(w){const m={'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10};if(!isNaN(Number(w))) return Number(w);return m[w]||null;}

function parseReference(text){
  const s = normalizeSpoken(text);
  const tokens = s.split(' ').filter(Boolean);
  // try up to 3-word book tokens (e.g. 'song of songs')
  for(let len=Math.min(3,tokens.length);len>=1;len--){
    const candidate=tokens.slice(0,len).join(' ');
    if(BOOK_ALIASES[candidate]){
      const book=BOOK_ALIASES[candidate];
      const rest=tokens.slice(len).join(' ');
      const colon=rest.match(/(\d+):(\d+)/);
      if(colon)return{book,chapter:+colon[1],verse:+colon[2]};
      const nums=rest.split(/\s+/).filter(Boolean);
      if(nums.length>=2){
        const c=+nums[0]||wordsToNumber(nums[0]);
        const v=+nums[1]||wordsToNumber(nums[1]);
        if(c&&v)return{book,chapter:c,verse:v};
      }
      // maybe user said only chapter (e.g. John 3) -> default verse 1
      if(nums.length===1){
        const c=+nums[0]||wordsToNumber(nums[0]);
        if(c) return {book, chapter:c, verse:1};
      }
    }
  }
  return null;
}

/* DOM refs */
const startStopBtn=document.getElementById('startStopBtn');
const micIcon=document.getElementById('micIcon');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const transcriptEl=document.getElementById('transcript');
const verseRefEl=document.getElementById('verseRef');
const verseBodyEl=document.getElementById('verseBody');
const logEl=document.getElementById('log');
const bigPlus=document.getElementById('bigPlus');
const bigMinus=document.getElementById('bigMinus');
const themeBtn=document.getElementById('themeBtn');
const loadLocalBtn=document.getElementById('loadLocalBtn');
const xmlFileInput=document.getElementById('xmlFileInput');

const verseStage = document.getElementById('verseStage');
const verseMaxBtn = document.getElementById('verseMaxBtn');

let currentRef=null, baseFontSize=44;
function log(msg){ logEl.innerText = msg; console.log(msg); }

/* ===== Local XML bible store =====
Structure:
  bibleData = {
    "Genesis": { "1": { "1": "In the beginning...", "2": "..." }, "2": {...} },
    "John": { "3": { "16": "For God so loved the world..." } }
  }
Also hold a set of book names for quick lookup.
*/
let bibleData = null;
let bibleBookNames = null;

/* Parse Zefania-like XML into bibleData */
function parseBibleXMLString(xmlString) {
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "application/xml");
    const parseError = doc.querySelector("parsererror");
    if (parseError) throw new Error("XML parse error");

    const bibleDataLocal = {};
    const books = doc.getElementsByTagName("BIBLEBOOK");
    for (let i=0; i<books.length; i++) {
      const book = books[i];
      const bname = book.getAttribute("bname") || book.getAttribute("bsname") || book.getAttribute("bnumber") || book.getAttribute("btitle") || "Unknown";
      const chapters = book.getElementsByTagName("CHAPTER");
      bibleDataLocal[bname] = bibleDataLocal[bname] || {};
      for (let c=0;c<chapters.length;c++){
        const chap = chapters[c];
        const cnumber = chap.getAttribute("cnumber") || String(c+1);
        bibleDataLocal[bname][cnumber] = bibleDataLocal[bname][cnumber] || {};
        const verses = chap.getElementsByTagName("VERS");
        for (let v=0; v<verses.length; v++){
          const vers = verses[v];
          const vnumber = vers.getAttribute("vnumber") || String(v+1);
          const text = (vers.textContent || "").trim();
          // store raw text (no trailing whitespace)
          bibleDataLocal[bname][cnumber][vnumber] = text;
        }
      }
    }

    // Build normalized book map for matching user-spoken book names to XML book names:
    const bookNamesSet = Object.keys(bibleDataLocal); // e.g. ["Genesis", "Exodus", ...]
    return {bibleDataLocal, bookNamesSet};
  } catch (e) {
    console.error(e);
    return null;
  }
}

/* attempt to map the parsed.book (like "John" or "1 John") to the xml book name.
We prefer exact match; fallback to case-insensitive; fallback to removing spaces; fallback to matching by starting substring.
*/
function resolveBookName(spokenBook) {
  if (!bibleData) return spokenBook; // no local bible loaded
  // if spokenBook already equals an XML book name return it
  if (bibleData[spokenBook]) return spokenBook;
  // try case-insensitive exact
  const keys = Object.keys(bibleData);
  const lower = spokenBook.toLowerCase();
  for (const k of keys) if (k.toLowerCase() === lower) return k;
  // try variants: remove spaces and dots
  const stripped = lower.replace(/[\s\.]/g,'');
  for (const k of keys) if (k.toLowerCase().replace(/[\s\.]/g,'') === stripped) return k;
  // try startsWith (e.g. "Song" -> "Song of Solomon")
  for (const k of keys) if (k.toLowerCase().startsWith(lower)) return k;
  // fallback: return spokenBook (so caller can still attempt remote)
  return spokenBook;
}

/* set mic visual state */
function setRecordingState(isRecording){
  if(!micIcon) return;
  if(isRecording){
    micIcon.classList.add('recording');
    micIcon.setAttribute('aria-hidden','false');
    micIcon.setAttribute('title','Recording — click Stop to end');
  } else {
    micIcon.classList.remove('recording');
    micIcon.setAttribute('aria-hidden','true');
    micIcon.setAttribute('title','Not recording');
  }
}

/* Show verse — prefers local bible if loaded, otherwise falls back to bible-api.com */
async function showVerse(parsed){
  try{
    if(!parsed) { log("No reference to show."); return; }
    const resolvedBook = bibleData ? resolveBookName(parsed.book) : parsed.book;
    // try local bible first
    if (bibleData && bibleData[resolvedBook] && bibleData[resolvedBook][String(parsed.chapter)] && bibleData[resolvedBook][String(parsed.chapter)][String(parsed.verse)]) {
      const text = bibleData[resolvedBook][String(parsed.chapter)][String(parsed.verse)];
      verseRefEl.innerText = `${resolvedBook} ${parsed.chapter}:${parsed.verse}`;
      verseBodyEl.innerText = text;
      verseBodyEl.style.fontSize = baseFontSize + 'px';
      currentRef = parsed;
      log(resolvedBook + ' ' + parsed.chapter + ':' + parsed.verse);
      return;
    }

    // if local bible is loaded but the requested verse isn't found:
    if (bibleData) {
      // maybe chapter exists but verse missing -> helpful message
      if (bibleData[resolvedBook] && bibleData[resolvedBook][String(parsed.chapter)]) {
        log(`Verse ${parsed.verse} not found in ${resolvedBook} ${parsed.chapter}.`);
      } else {
        log(`Chapter ${parsed.chapter} not found in ${resolvedBook}.`);
      }
      // still continue to remote fallback if desired
    }

    // Fallback to remote bible-api.com if available
    const ref = `${parsed.book} ${parsed.chapter}:${parsed.verse}`;
    log('Trying remote API for: ' + ref);
    const resp = await fetch(`https://bible-api.com/${encodeURIComponent(ref)}`);
    if(!resp.ok) throw new Error('Remote API status ' + resp.status);
    const data = await resp.json();
    verseRefEl.innerText = data.reference + (data.translation_id ? ` — ${data.translation_id}` : '');
    verseBodyEl.innerText = data.text.trim();
    verseBodyEl.style.fontSize = baseFontSize + 'px';
    currentRef = parsed;
    log('Loaded from remote API.');
  }catch(e){ log('Error: ' + (e && e.message ? e.message : e)); }
}

/* navigation buttons */
prevBtn.addEventListener('click',()=>{ if(currentRef && currentRef.verse>1) showVerse({...currentRef,verse:currentRef.verse-1}); });
nextBtn.addEventListener('click',()=>{ if(currentRef) showVerse({...currentRef,verse:currentRef.verse+1}); });
bigPlus.addEventListener('click',()=>{ baseFontSize=Math.min(120,baseFontSize+8); verseBodyEl.style.fontSize=baseFontSize+'px'; });
bigMinus.addEventListener('click',()=>{ baseFontSize=Math.max(18,baseFontSize-6); verseBodyEl.style.fontSize=baseFontSize+'px'; });

/* Theme toggle */
themeBtn.addEventListener('click',()=>{
  const body=document.body;
  body.dataset.theme = (body.dataset.theme==="dark" ? "light" : "dark");
});

/* Fullscreen / maximize handling for verseStage */
function isDocumentInFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}

async function requestFullscreen(element) {
  if (element.requestFullscreen) return element.requestFullscreen();
  if (element.webkitRequestFullscreen) return element.webkitRequestFullscreen();
  if (element.msRequestFullscreen) return element.msRequestFullscreen();
  return Promise.reject(new Error('Fullscreen API not supported'));
}

async function exitFullscreen() {
  if (document.exitFullscreen) return document.exitFullscreen();
  if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  if (document.msExitFullscreen) return document.msExitFullscreen();
  return Promise.reject(new Error('Exit Fullscreen API not supported'));
}

function updateMaxButtonUI(isFull) {
  verseMaxBtn.setAttribute('aria-pressed', String(!!isFull));
  verseMaxBtn.title = isFull ? 'Exit fullscreen (Esc or F)' : 'Maximize (F)';
  verseMaxBtn.innerText = isFull ? '⤡' : '⤢'; // different glyph for exit/enter
  if (isFull) verseStage.classList.add('fullscreen'); else verseStage.classList.remove('fullscreen');
}

async function toggleFullscreen() {
  try {
    const inFs = isDocumentInFullscreen();
    if (!inFs) {
      // Prefer requesting fullscreen on the verseStage element
      await requestFullscreen(verseStage);
      updateMaxButtonUI(true);
    } else {
      // If already in fullscreen, exit (this may exit a different element too)
      await exitFullscreen();
      updateMaxButtonUI(false);
    }
  } catch (err) {
    console.warn('Fullscreen toggle failed', err);
    log('Fullscreen not available: ' + (err && err.message ? err.message : err));
  }
}

// Hook the button
verseMaxBtn.addEventListener('click', (ev) => {
  ev.stopPropagation();
  toggleFullscreen();
});

// Listen for fullscreen change events (user pressed ESC or browser toggled)
document.addEventListener('fullscreenchange', () => updateMaxButtonUI(isDocumentInFullscreen()));
document.addEventListener('webkitfullscreenchange', () => updateMaxButtonUI(isDocumentInFullscreen()));
document.addEventListener('msfullscreenchange', () => updateMaxButtonUI(isDocumentInFullscreen()));

// Also provide a keyboard shortcut: "F" toggles fullscreen when focused anywhere
document.addEventListener('keydown', (ev) => {
  // if user is typing in an input/textarea, do not intercept F
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement.isContentEditable) return;

  if (ev.key && ev.key.toLowerCase() === 'f') {
    ev.preventDefault();
    toggleFullscreen();
  }
});

/* SpeechRecognition */
if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){ log('SpeechRecognition not available.'); startStopBtn.disabled=true; }
else{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const recog=new SpeechRecognition();
  recog.lang='en-US';recog.interimResults=false;recog.maxAlternatives=1;
  let listening=false;

  startStopBtn.addEventListener('click',()=>{
    try {
      if(!listening){
        recog.start();
        listening=true;
        startStopBtn.innerText='Stop';
        log('Listening…');
        setRecordingState(true); // show mic
      } else {
        recog.stop();
        // onend will clear UI and setRecordingState(false)
      }
    } catch (err) { console.error(err); }
  });

  recog.onresult=async(ev)=>{
    const text=ev.results[0][0].transcript;
    transcriptEl.innerText='Heard: "'+text+'"';
    const parsed=parseReference(text);
    if(parsed) await showVerse(parsed);
    else log('Could not parse reference.');
  };
  recog.onend=()=>{ listening=false; startStopBtn.innerText='Start'; setRecordingState(false); };
  recog.onerror = (e) => {
    console.warn('SpeechRecognition error', e);
    // ensure recording state is cleared
    listening = false;
    startStopBtn.innerText = 'Start';
    setRecordingState(false);
  };
}

/* keyboard navigation */
document.addEventListener('keydown',(ev)=>{
  // left/right arrows
  if(ev.key==="ArrowLeft"&&currentRef&&currentRef.verse>1) showVerse({...currentRef,verse:currentRef.verse-1});
  if(ev.key==="ArrowRight"&&currentRef) showVerse({...currentRef,verse:currentRef.verse+1});

  // meta toggles (see below)
});

/* === Meta / Windows key trigger for start/stop mic === */
(function() {
  let lastToggle = 0;
  const DEBOUNCE_MS = 400;
  function tryToggleFromEvent(ev) {
    const now = Date.now();
    if (now - lastToggle < DEBOUNCE_MS) return;
    lastToggle = now;
    const btn = document.getElementById('startStopBtn');
    if (!btn || btn.disabled) return;
    btn.click();
  }
  document.addEventListener('keydown', (ev) => {
    try {
      if (ev.key === 'm') {
        ev.preventDefault?.();
        tryToggleFromEvent(ev); return;
      }
      if (ev.metaKey && (ev.code === 'Space' || ev.key.toLowerCase() === 'm')) {
        ev.preventDefault?.(); tryToggleFromEvent(ev); return;
      }
      if (ev.ctrlKey && ev.altKey && ev.key.toLowerCase() === 'm') {
        ev.preventDefault?.(); tryToggleFromEvent(ev); return;
      }
    } catch (err) {
      console.warn('Meta key toggle error', err);
    }
  }, { passive: false });
})();

/* ===== Load local XML: try fetch first, otherwise allow user to pick file ===== */

async function tryLoadXmlFromServer(path='English_Catholic_XML.xml'){
  log('Attempting to fetch local XML: ' + path);
  try {
    const resp = await fetch(path, {cache: "no-store"});
    if (!resp.ok) throw new Error('Fetch status ' + resp.status);
    const text = await resp.text();
    const parsed = parseBibleXMLString(text);
    if (!parsed) throw new Error('Failed to parse XML from server response');
    bibleData = parsed.bibleDataLocal;
    bibleBookNames = parsed.bookNamesSet;
    log('Local XML loaded from server: ' + path + ' — Books: ' + Object.keys(bibleData).length);
    return true;
  } catch (e) {
    console.warn('Server fetch failed:', e);
    return false;
  }
}

function promptUserToSelectXmlFile() {
  log('Please select the English_Catholic_XML.xml file from disk.');
  xmlFileInput.click();
}

xmlFileInput.addEventListener('change', async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) { log('No file selected'); return; }
  log('Reading file: ' + f.name);
  try {
    const txt = await f.text();
    const parsed = parseBibleXMLString(txt);
    if (!parsed) { log('Failed to parse selected XML file.'); return; }
    bibleData = parsed.bibleDataLocal;
    bibleBookNames = parsed.bookNamesSet;
    log('Local XML loaded from file: ' + f.name + ' — Books: ' + Object.keys(bibleData).length);
    // attempt to show previously requested currentRef if present
    if (currentRef) showVerse(currentRef);
  } catch (e) {
    console.error(e); log('Error reading file: ' + (e && e.message ? e.message : e));
  }
});

/* Load local button handler: tries fetch then fallback to file prompt */
loadLocalBtn.addEventListener('click', async () => {
  const ok = await tryLoadXmlFromServer();
  if (!ok) promptUserToSelectXmlFile();
});

/* On load: try fetching automatically; if fails, leave it for user to click 'Load local XML' */
(async function init(){
  const ok = await tryLoadXmlFromServer();
  if (!ok) {
    log('Local XML not found on server. Click "Load local XML" to open a file from disk.');
  } else {
    // If fetch loaded successfully, optionally show a welcome verse
    // e.g. Genesis 1:1
    showVerse({book: "Genesis", chapter: 1, verse: 1});
  }
})();
</script>
