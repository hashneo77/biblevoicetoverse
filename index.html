<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Voice</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- External stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>

<body data-theme="light" data-language="EN">
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <h1>Bible Voice</h1>
          <p class="lead">Click Start and Speak a reference.</p>
        </div>
      </div>

      <div class="controls" role="toolbar" aria-label="Controls">
        <button id="startStopBtn" class="btn" aria-pressed="false">Start</button>
        <button id="prevBtn" class="btn secondary icon" title="Previous verse">◀</button>
        <button id="nextBtn" class="btn secondary icon" title="Next verse">▶</button>
        <button id="langBtn" class="btn secondary" title="Toggle language">EN / ML</button>
        <button id="bigMinus" class="btn secondary" title="Decrease font">A-</button>
        <button id="bigPlus" class="btn" title="Increase font">A+</button>
        <button id="themeBtn" class="btn" title="Toggle theme">🌞/🌙</button>
        <button id="loadLocalBtn" class="btn secondary" title="Load local XML">XML</button>

        <div class="search-wrap" style="margin-left:6px;">
          <input id="searchInput"
                placeholder="Search verses or type a reference (e.g. John 3:16)"
                aria-label="Search verses"
                autocomplete="off" />
          <div id="searchSuggestions"
              class="suggestions"
              style="display:none;"
              role="listbox"
              aria-label="Search suggestions"></div>
        </div>

      </div>
    </div>

    <div class="panel" role="main">
      <div class="transcript" id="transcript" aria-live="polite"></div>

      <div class="verse-stage" id="verseStage" role="region" aria-label="Verse display">
        <button id="verseRecBtn" class="verse-rec-btn" aria-hidden="true" title="Recording" type="button">●</button>
        <button id="verseMaxBtn" class="verse-max-btn" aria-pressed="false" title="Maximize (F)">⤢</button>

        <div>
          <div class="verse-ref" id="verseRef">Jesus Loves You</div>
          <div class="verse-body" id="verseBody"></div>
        </div>
      </div>

      <div class="log" id="log" aria-live="polite">Ready</div>
    </div>
  </div>

  <input id="xmlFileInput" type="file" accept=".xml,.XML" />

  <!-- App script -->
  <script src="script.js" defer></script>
</body>
</html>
