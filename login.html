<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Bible Voice — Sign In</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <!-- Shared styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyBkg__6ueuUWRGYZRF8-iqWmzb3OfKn8Mw",
      authDomain: "biblevoicetoverse.firebaseapp.com",
      databaseURL: "https://biblevoicetoverse-default-rtdb.firebaseio.com",
      projectId: "biblevoicetoverse",
      storageBucket: "biblevoicetoverse.firebasestorage.app",
      messagingSenderId: "817133011749",
      appId: "1:817133011749:web:efc22d1c1ebc54a42790cc"
    });
  </script>
</head>

<body data-theme="dark" class="login-page">
  <div class="login-card">
    <div class="login-logo" aria-hidden="true"></div>
    <h1 class="login-title">Bible Voice</h1>
    <p class="login-tagline">Speak a reference. See the Word.</p>
    <button id="googleSignInBtn" class="btn login-btn">Sign in with Google</button>
    <p class="login-status" id="loginStatus"></p>
  </div>

  <script>
    const auth = firebase.auth();
    const btn = document.getElementById('googleSignInBtn');
    const status = document.getElementById('loginStatus');

    // If already signed in, go straight to the app
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Signing in...';
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        // onAuthStateChanged will redirect
      } catch (e) {
        btn.disabled = false;
        status.textContent = e.message || 'Sign-in failed. Please try again.';
        console.warn('Sign-in error:', e);
      }
    });
  </script>
</body>
</html>
